name: Source checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tracked Python syntax
        run: python tools/check_python_syntax.py
      - name: Check source order
        run: python tools/check_source_order.py --check
# Retail byte matching needs local game files and toolchains; CI does not claim it.
