name: St06 Overlay (A.VFS:bin/st06.bin)
sha1: bf87b950879a63d3da33e61cdefe4118c7abe0f2
options:
  basename: st06
  target_path: assets/us/bin/st06.bin
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/st06
  src_path: src/battle/stages/st06
  build_path: build/us
  ld_script_path: config/us/linkers/st06.ld
  elf_path: build/us/st06.elf
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  pair_rodata_to_text: False

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  dump_symbols: True
  dump_symbols_references: True

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/us/sym.st06.txt
  reloc_addrs_path:
    - config/us/rel.st06.txt

  undefined_funcs_auto_path: config/us/linkers/undefined_funcs_auto.st06.txt
  undefined_syms_auto_path: config/us/linkers/undefined_syms_auto.st06.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False
segments:
  - name: st06
    type: code
    start: 0x0
    vram: 0x800d3b00
    align: 4
    subalign: 4
    subsegments:
      # id number, pointer tables and rodata
      - [0x0, rodata, 0]
      # The three isolated constructors use PsyQ 4.6; surrounding ranges use
      # the shipped compiler. Keep these source ranges in retail address order.
      - [0x3F0, c, 3F0]
      - [0xC48, c, C48]
      - [0xCA4, c, CA4]
      - [0x1820, c, 1820]
      - [0x186C, c, 186C]
      - [0x1D5C, c, 1D5C]
      - [0x1DB4, c, 1DB4]
      # 0x1FA4..0x22F4 is the psyq 4.6 (2.95.2) sub-range: func_800D5AA4
      # and func_800D5BB8 are byte-exact only under 4.6.
      - [0x1FA4, c, 1FA4]
      # 0x22F4..end: func_800D5DF4 is shipped-only (register pinning).
      - [0x22F4, c, 22F4]
  - [0x234c]
