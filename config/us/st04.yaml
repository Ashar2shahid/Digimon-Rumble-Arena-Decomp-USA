name: St04 Overlay (A.VFS:bin/st04.bin)
sha1: 437e5a5953fe84ad34127644927c75c946654bbc
options:
  basename: st04
  target_path: assets/us/bin/st04.bin
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/st04
  src_path: src/battle/stages/st04
  build_path: build/us
  ld_script_path: config/us/linkers/st04.ld
  elf_path: build/us/st04.elf
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  pair_rodata_to_text: False

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  dump_symbols: True
  dump_symbols_references: True

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/us/sym.st04.txt
  reloc_addrs_path:
    - config/us/rel.st04.txt

  undefined_funcs_auto_path: config/us/linkers/undefined_funcs_auto.st04.txt
  undefined_syms_auto_path: config/us/linkers/undefined_syms_auto.st04.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False
segments:
  - name: st04
    type: code
    start: 0x0
    vram: 0x800d3b00
    align: 4
    subalign: 4
    subsegments:
      # id number, pointer tables and rodata
      - [0x0, rodata, 0]
      # code and data from the first function prologue; the old 2A4 slot is
      # mixed-revision (see docs/CC1_REVISIONS.md and docs/DIFFICULT_FUNCTIONS.md):
      #   2A4   [0x2A4,0x5864)  egcs-1.1.2 + -fno-strength-reduce
      #   5864  [0x5864,0x59B0) shipped 2.8.1 + -fno-strength-reduce
      #                          (func_800D5864, non-LSR loop)
      #   59B0  [0x59B0,0x67EC) egcs-1.1.2 + -fno-strength-reduce
      #   67EC  [0x67EC,0x6948) shipped 2.8.1 + -fno-strength-reduce
      #                          (func_800D67EC, non-LSR loop)
      #   6948  [0x6948,0x52A0) egcs-1.1.2 + -fno-strength-reduce
      - [0x2A4, c, 2A4]
      - [0x5864, c, 5864]
      - [0x59B0, c, 59B0]
      - [0x67EC, c, 67EC]
      - [0x6948, c, 6948]
  - [0x52a0]
