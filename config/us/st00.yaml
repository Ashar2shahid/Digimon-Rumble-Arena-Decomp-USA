name: St00 Overlay (A.VFS:bin/st00.bin)
sha1: 07a7a0ff8cc3b4171f0357cc871426dd96dd5fd3
options:
  basename: st00
  target_path: assets/us/bin/st00.bin
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/st00
  src_path: src/battle/stages/st00
  build_path: build/us
  ld_script_path: config/us/linkers/st00.ld
  elf_path: build/us/st00.elf
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  pair_rodata_to_text: False

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  dump_symbols: True
  dump_symbols_references: True

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/us/sym.st00.txt
  reloc_addrs_path:
    - config/us/rel.st00.txt

  undefined_funcs_auto_path: config/us/linkers/undefined_funcs_auto.st00.txt
  undefined_syms_auto_path: config/us/linkers/undefined_syms_auto.st00.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False
segments:
  - name: st00
    type: code
    start: 0x0
    vram: 0x800d3b00
    align: 4
    subalign: 4
    subsegments:
      # id number, pointer tables and rodata
      - [0x0, rodata, 0]
      # code and data from the first function prologue
      - [0x354, c, 354]
      - [0x4768, c, 4768]
      - [0x47BC, c, 47BC]
      - [0x54D4, c, 54D4]
      - [0x5528, c, 5528]
      - [0x6150, c, 6150]
      - [0x618C, c, 618C]
  - [0x6afc]
